name: Build latest deployment package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-cloud.txt

      - name: Run workflow tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build deployment ZIP
        shell: pwsh
        run: |
          ./scripts/package.ps1
          $version = (Get-Content -Raw VERSION).Trim()
          Copy-Item -LiteralPath "dist/autodev-hybrid-$version.zip" -Destination "dist/autodev-hybrid-latest.zip"
          $hash = (Get-FileHash -LiteralPath "dist/autodev-hybrid-latest.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  autodev-hybrid-latest.zip" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding utf8NoBOM

      - name: Publish mutable latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          git tag -f latest $env:GITHUB_SHA
          git push origin refs/tags/latest --force
          gh release view latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit latest --repo $env:GITHUB_REPOSITORY --title "AutoDev latest · v$version" --notes "由 main 分支自动构建。服务器可使用固定 latest 地址下载并一键升级。"
          }
          else {
            gh release create latest --repo $env:GITHUB_REPOSITORY --title "AutoDev latest · v$version" --notes "由 main 分支自动构建。服务器可使用固定 latest 地址下载并一键升级。"
          }
          gh release upload latest --repo $env:GITHUB_REPOSITORY "dist/autodev-hybrid-latest.zip" "dist/SHA256SUMS.txt" --clobber

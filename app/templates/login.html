<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e4ecdf">
  <title>AutoDev 自主研发交付</title>
  <link rel="icon" href="/static/brand/favicon.ico?v={{ app_version }}" sizes="any">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/brand/site.webmanifest">
  <link rel="stylesheet" href="/static/styles.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/brand-ui.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/editorial-ui.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/mint-ui.css?v={{ app_version }}">
</head>
<body class="login-body mint-ui">
  <main class="login-shell">
    <div class="login-film" data-film-stage aria-hidden="true">
      <video data-brand-video="login" class="login-film-video" muted loop playsinline preload="metadata" tabindex="-1" disablepictureinpicture hidden></video>
    </div>
    <section class="login-brand-story" aria-label="AutoDev 自主研发交付">
      <img class="login-story-mark" src="/static/brand/autodev-sidebar-mark.png?v={{ app_version }}" alt="">
      <strong>AutoDev</strong>
      <h1>编号进入，交付离场。</h1>
      <p class="login-story-caption">AUTONOMOUS<br>SOFTWARE DEVELOPMENT<br>AND DELIVERY PLATFORM</p>
      <div class="login-character-stage">
        <div id="login-orb-character" class="autodev-orb" role="img" aria-label="AutoDev 橙色球体动态角色">
          <canvas class="autodev-orb-canvas" aria-hidden="true"></canvas>
          <svg class="autodev-orb-fallback" aria-hidden="true"></svg>
        </div>
        <div class="orb-paper-note" aria-hidden="true"><span>让想法<br>变成可运行的软件。</span><i>〈∞〉</i></div>
      </div>
    </section>
    <section class="login-panel" aria-label="进入工作台">
      <div class="login-panel-brand">
        <div class="login-panel-logo" aria-label="AutoDev">
          <img src="/static/brand/autodev-sidebar-mark.png?v={{ app_version }}" alt="">
          <strong>AutoDev</strong>
        </div>
      </div>
      <form id="login-form" class="form-stack">
        <label><span>用户名</span><input name="username" autocomplete="username" placeholder="请输入用户名" required autofocus></label>
        <label><span>密码</span><input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-large" type="submit"><span>进入工作台</span><i aria-hidden="true">→</i></button>
      </form>
    </section>
  </main>
  <script src="/static/grok-character/geometry-data.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/math.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/tables.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/pose.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/tricks.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/fx.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/eyes.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/character.js?v={{ app_version }}"></script>
  <script src="/static/orb-character.js?v={{ app_version }}"></script>
  <script>
    const loginCharacter = new AutoDevOrb(document.querySelector('#login-orb-character'), {
      environment: 'light', mode: 'onboarding', ambient: true, followPointer: true, sizePx: 300, state: 'curious',
    });
    window.addEventListener('pagehide', () => loginCharacter.destroy(), {once:true});
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget, button = form.querySelector('button'), error = document.querySelector('#login-error');
      if (button.disabled) return;
      button.disabled = true;
      button.querySelector('span').textContent = '正在进入…';
      error.hidden = true;
      const timeout = new AbortController();
      const timer = setTimeout(() => timeout.abort(), 15000);
      try {
        const response = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(Object.fromEntries(new FormData(form))), signal:timeout.signal,
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(typeof data.detail === 'string' ? data.detail : '登录失败，请检查用户名和密码');
        }
        loginCharacter.dispatchOnce(button);
        document.querySelector('.login-shell').classList.add('is-authenticating');
        const requestedTask = new URLSearchParams(location.search).get('request') || '';
        const destination = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(requestedTask)
          ? '/?request=' + encodeURIComponent(requestedTask) + '&acceptance=1' : '/';
        setTimeout(() => { location.href = destination; }, 350);
      } catch (failure) {
        error.textContent = failure.name === 'AbortError' ? '连接超时，请稍后重试。' : (failure.message || '暂时无法连接，请重试。');
        error.hidden = false;
        button.disabled = false;
        button.querySelector('span').textContent = '进入工作台';
        loginCharacter.setState('confused');
      } finally { clearTimeout(timer); }
    });
  </script>
  <script type="module" src="/static/orb-scene.js?v={{ app_version }}"></script>
  <script src="/static/brand-media.js?v={{ app_version }}"></script>
</body>
</html>

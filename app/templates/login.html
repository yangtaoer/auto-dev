<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171813">
  <title>登录 · AutoDev 自主研发交付</title>
  <link rel="icon" href="/static/brand/favicon.ico?v={{ app_version }}" sizes="any">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/brand/site.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/brand-ui.css?v={{ app_version }}-login-hero">
  <link rel="stylesheet" href="/static/editorial-ui.css?v={{ app_version }}-login">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-brand">
      <div class="login-logo-lockup" aria-label="AutoDev">
        <span class="login-logo-symbol"><img src="/static/brand/autodev-sidebar-mark.png?v={{ app_version }}" alt=""></span>
        <strong>Auto<span>Dev</span></strong>
      </div>
      <div class="login-edition">AUTONOMOUS DELIVERY DESK · SECURE ENTRY</div>
      <div class="login-copy">
        <p class="eyebrow">自主交付 / AUTONOMOUS DELIVERY</p>
        <h1>编号进入，<br>交付离场。</h1>
      </div>
      <div class="delivery-loop" aria-hidden="true">
        <div class="loop-head"><span>PROJECT PIPELINE</span><em>AUTO / 01—04</em></div>
        <div class="loop-rail"><span class="loop-progress"></span><i></i><i></i><i></i><i></i><b></b></div>
        <div class="loop-labels"><span><em>01</em>需求准入</span><span><em>02</em>自主研发</span><span><em>03</em>合并校验</span><span><em>04</em>交付离场</span></div>
      </div>
      <div class="orbit orbit-a" aria-hidden="true"></div><div class="orbit orbit-b" aria-hidden="true"></div>
    </section>
    <section class="login-panel">
      <div class="login-character-stage">
        <div id="login-orb-character" class="autodev-orb" role="img" aria-label="AutoDev 橙色球体动态角色">
          <canvas class="autodev-orb-canvas" aria-hidden="true"></canvas>
          <svg class="autodev-orb-fallback" aria-hidden="true"></svg>
        </div>
      </div>
      <div>
        <div class="mobile-brand" aria-label="AutoDev">
          <span><img src="/static/brand/autodev-sidebar-mark.png?v={{ app_version }}" alt=""></span>
          <strong>Auto<em>Dev</em></strong>
        </div>
        <p class="eyebrow">登录 / SIGN IN</p>
        <h2>登录</h2>
      </div>
      <form id="login-form" class="form-stack">
        <label><span>用户名</span><input name="username" autocomplete="username" placeholder="请输入用户名" required autofocus></label>
        <label><span>密码</span><input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
        <p id="login-error" class="form-error" hidden></p>
        <button class="btn btn-primary btn-large" type="submit"><span>登录系统</span><i>↗</i></button>
      </form>
      {% if demo_enabled %}
      <div class="demo-credential"><span>首次体验</span><code>admin / admin123</code><code>pm / pm123</code></div>
      {% endif %}
    </section>
  </main>
  <script src="/static/grok-character/geometry-data.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/math.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/tables.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/pose.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/tricks.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/fx.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/eyes.js?v={{ app_version }}"></script>
  <script src="/static/grok-character/src/character.js?v={{ app_version }}"></script>
  <script src="/static/orb-character.js?v={{ app_version }}"></script>
  <script>
    const loginCharacter = new AutoDevOrb(document.querySelector('#login-orb-character'), {
      environment: 'light',
      followPointer: true,
      sizePx: 112,
      state: 'curious',
    });
    window.addEventListener('pagehide', () => loginCharacter.destroy(), {once: true});

    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      const error = document.querySelector('#login-error');
      button.disabled = true; error.hidden = true;
      const payload = Object.fromEntries(new FormData(event.currentTarget));
      const response = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if (response.ok) location.href = '/';
      else { const data = await response.json(); error.textContent = data.detail || '登录失败'; error.hidden = false; button.disabled = false; }
    });
  </script>
</body>
</html>
